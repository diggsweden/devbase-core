name: Pull Request Workflow
on: # yamllint disable-line rule:truthy
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-checks:
    uses: diggsweden/reusable-ci/.github/workflows/pullrequest-orchestrator.yml@617cb32268cb6aefdfa4117b4159d37e3b47d7b3 # v2.8.3
    permissions:
      contents: read
      packages: read
      security-events: write
    # No `secrets:` block on purpose: reusable-ci declares no
    # `on.workflow_call.secrets` and its jobs run on the automatic GITHUB_TOKEN.
    with:
      reusable-ci-ref: 617cb32268cb6aefdfa4117b4159d37e3b47d7b3
      project-type: maven
      linters.devbasecheck: true
      linters.commitlint: false
      linters.licenselint: false
      linters.megalint: false
      linters.publiccodelint: false
