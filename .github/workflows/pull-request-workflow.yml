name: Pull Request Workflow
on: # yamllint disable-line rule:truthy
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-checks:
    uses: diggsweden/reusable-ci/.github/workflows/pullrequest-orchestrator.yml@997d7dc2238b40c79798fda309d8061b0707a3e5 # v3.0.0
    permissions:
      contents: read
      packages: read
    # reusable-ci v3 takes explicit secret mappings only. The jobs run on the
    # automatic GITHUB_TOKEN; CODE_SCANNING_TOKEN is optional and only enables
    # the SARIF upload to Code Scanning.
    secrets:
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    with:
      reusable-ci-ref: 997d7dc2238b40c79798fda309d8061b0707a3e5
      project-type: maven
      linters.devbasecheck: true
      linters.commitlint: false
      linters.licenselint: false
      linters.megalint: false
      linters.publiccodelint: false
