name: Release Workflow
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha*"
      - "v[0-9]+.[0-9]+.[0-9]+-beta*"
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    uses: diggsweden/reusable-ci/.github/workflows/release-orchestrator.yml@617cb32268cb6aefdfa4117b4159d37e3b47d7b3 # v2.8.3
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
      security-events: write
      attestations: write
    # reusable-ci relies on `inherit` end to end: it declares no
    # `on.workflow_call.secrets` but forwards the store to its nested jobs,
    # which need OSPO_BOT_GPG_* and RELEASE_BOT_TOKEN.
    secrets: inherit
    with:
      reusable-ci-ref: 617cb32268cb6aefdfa4117b4159d37e3b47d7b3
      artifacts-config: .github/artifacts.yml
      changelog-creator: git-cliff
      release-publisher: github-cli
      release.draft: false
      # Skip version bump (no version files to update)
      changelog.skipversionbump: true
